<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nomo Trade 개인정보 처리방침 · Privacy Policy</title>
<meta name="description" content="Nomo Trade 개인정보 처리방침 / Nomo Trade privacy policy">
<link rel="canonical" href="https://hj-lee-coder.github.io/NOMOTrade/privacy/">
<link rel="alternate" hreflang="ko" href="https://hj-lee-coder.github.io/NOMOTrade/privacy/ko/">
<link rel="alternate" hreflang="en" href="https://hj-lee-coder.github.io/NOMOTrade/privacy/en/">
<style>
  :root { color-scheme: light dark; --accent: #2f6bd6; }
  @media (prefers-color-scheme: dark) { :root { --accent: #6aa0ff; } }
  body { font: 16px/1.7 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", "Segoe UI", Roboto, sans-serif; margin: 0; padding: 56px 16px; text-align: center; }
  h1 { font-size: 1.4rem; margin: 0 0 24px; }
  a.btn { display: block; max-width: 320px; margin: 12px auto; padding: 14px 18px; border: 1px solid var(--accent); border-radius: 12px; color: var(--accent); text-decoration: none; font-weight: 600; }
</style>
<script>
  // 예전 주소(#en, #ko)와 브라우저 언어에 맞춰 해당 언어 페이지로 이동한다. (JS 가 꺼져 있으면 아래 링크를 쓴다)
  (function () {
    var hash = (location.hash || "").toLowerCase();
    var lang = hash === "#en" ? "en" : hash === "#ko" ? "ko"
      : ((navigator.language || "").toLowerCase().indexOf("ko") === 0 ? "ko" : "en");
    location.replace(lang + "/");
  })();
</script>
</head>
<body>
  <h1>Nomo Trade</h1>
  <a class="btn" href="ko/">개인정보 처리방침 (한국어)</a>
  <a class="btn" href="en/">Privacy Policy (English)</a>
</body>
</html>
